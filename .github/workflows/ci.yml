name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck rampart examples/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats gawk sqlite3
      # macOS ships bash 3.2; Homebrew's bash comes first on the runner's PATH
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bash bats-core
      - run: bats tests
      - run: ./examples/demo.sh
